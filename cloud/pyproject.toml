# A second distribution, and not for tidiness.
#
# `neti` is Apache-2.0. `neti-cloud` is BUSL-1.1. Shipping both in one wheel would put BUSL code
# inside an artifact whose metadata says Apache-2.0 — a licence misstatement that no amount of
# README prose corrects, because the metadata is what tooling and auditors read.
#
# So: two projects, two licences, one repository. `pip install neti` gets you the whole free tier
# and nothing that is not Apache-2.0. `pip install neti-cloud` is a deliberate second act.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neti-cloud"
version = "0.1.0"
description = "The neti control plane: approvals, org policy and audit across every agent."
readme = "README.md"
requires-python = ">=3.12"
license = "BUSL-1.1"
license-files = ["LICENSE"]
keywords = ["mcp", "agents", "security", "approvals", "blast-radius"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.12",
    "httpx[http2]>=0.27",
]

[project.urls]
Homepage = "https://github.com/neti-gate/neti"
Licensing = "https://github.com/neti-gate/neti/blob/main/LICENSING.md"

[project.scripts]
# Its own command rather than a `neti cloud` subcommand: the free CLI must never import the paid
# package, and tests/property/test_licence_boundary.py enforces that.
neti-cloud = "neti_cloud.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/neti_cloud"]
