[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neti"
version = "0.1.0"
description = "A preflight gate for agent tool calls: resolve what an action will touch, block it if it exceeds a declared ceiling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
graph = ["httpx[http2]>=0.27", "msal>=1.31"]
mcp = ["httpx[http2]>=0.27"]
cli = ["typer>=0.12", "rich>=13.9"]
dev = [
    "pytest>=8.3",
    "types-pyyaml>=6.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.7",
]

[project.scripts]
neti = "neti.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/neti"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/neti"]
plugins = ["pydantic.mypy"]

# The core is the part that must be type-tight: it is the whole decision.
[[tool.mypy.overrides]]
module = "neti.core.*"
strict = true
disallow_any_explicit = false   # Resolution.evidence is deliberately dict[str, Any]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
