[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neti"
version = "0.1.0"
description = "A preflight gate for agent tool calls: resolve what an action will touch, block it if it exceeds a declared ceiling."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "agents", "security", "blast-radius", "preflight", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.urls]
# Kept in step with src/neti/_website.py by tests/property/test_urls_agree.py — one place to edit.
Homepage = "https://neti-security.github.io/neti/"
Source = "https://github.com/Neti-Security/neti"
Issues = "https://github.com/Neti-Security/neti/issues"
Licensing = "https://github.com/Neti-Security/neti/blob/main/LICENSING.md"

[project.optional-dependencies]
graph = ["httpx[http2]>=0.27", "msal>=1.31"]
mcp = ["httpx[http2]>=0.27"]
cli = ["typer>=0.12", "rich>=13.9"]
console = ["fastapi>=0.115", "uvicorn>=0.32"]
# Only `storage.objects` needs this, and it imports boto3 inside the call rather than at module
# scope — so a policy that never binds that resolver never pays for it. Left out of `all`
# deliberately: boto3 is a large dependency to hand somebody who is gating a coding agent.
storage = ["boto3>=1.35"]
# `db.rows` needs no driver for sqlite (stdlib) and psycopg only for postgres. Same deferred-import
# shape as boto3, and out of `all` for the same reason.
database = ["psycopg[binary]>=3.2"]
# Everything a single machine needs, which is the entire free tier. `pipx install neti[all]`.
all = [
    "httpx[http2]>=0.27",
    "msal>=1.31",
    "typer>=0.12",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
# The agent runtimes neti adapts to. Test-only: nothing in `neti` imports them at module scope,
# and each adapter imports its SDK inside the function that needs it, so `pip install neti` pulls
# in none of them.
sdks = [
    "anthropic>=0.120",
    "openai>=2.0",
    "openai-agents>=0.19",
    "langchain-core>=0.3",
    # langgraph, not just langchain-core: the LangGraph adapter's only real regression test runs a
    # compiled StateGraph, because `ToolNode` requires a ToolMessage back and a direct `invoke`
    # never reveals that. Without this the one test that caught the defect silently skips.
    "langgraph>=0.6",
]
# The other four runtimes, kept out of `sdks` on purpose. These four resolve and install cleanly
# alongside everything above — measured, not assumed — but their closure is ~200 packages including
# chromadb, numpy, kubernetes and a full OpenTelemetry stack, almost all of it arriving via CrewAI.
# `just install` should not hand somebody gating a coding agent a vector database, so this is a
# separate line. CI installs both, and `tests/e2e/test_no_silent_skips.py` requires all four to
# import under NETI_REQUIRE_SDKS — otherwise four seams skip silently, which is the exact failure
# that file exists to prevent.
sdks-extended = [
    # 1.5.0 is where `crewai.hooks` first exists. Below that the only seam is wrapping
    # `CrewStructuredTool`, which is a pydantic model and a different adapter entirely.
    "crewai>=1.5.0",
    # 2.16 is where `ToolFailed` arrives — the exception that becomes a failed tool *result* rather
    # than a retry prompt, which is the shape this product needs.
    "pydantic-ai>=2.16",
    "autogen-agentchat>=0.5.5",
    "autogen-core>=0.5.5",
    # 1.7 is where plugin-level `before_tool_callback` arrives; `App(plugins=...)` needs 1.14.
    "google-adk>=1.14",
]
dev = [
    "pytest>=8.3",
    "types-pyyaml>=6.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.7",
]

[project.scripts]
neti = "neti.cli:app"

[tool.hatch.build]
# The built console, produced at package time rather than committed — `just console-sync` runs the
# Next export and drops it in `src/neti/console`, which .gitignore excludes. Declared globally
# because `uv build` makes the wheel out of the sdist, so listing it on the wheel target alone
# leaves it out of both.
#
# A source checkout that has never built the web app simply has no console, and `neti console` says
# so rather than starting a server that answers every page with a 404.
artifacts = ["src/neti/console/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/neti"]

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "web/.next", "web/out", ".venv", "out", "dist"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Declared rather than inferred: ruff decides first-party by what is installed, so a checkout with
# the control plane installed sorted imports differently from one without, and `ruff format --check`
# disagreed with itself between a developer's machine and CI. `neti_cloud` stays listed for exactly
# that reason — it is a separate repository now, but a developer who has it installed alongside must
# still get the same sort as one who does not.
known-first-party = ["neti", "neti_cloud"]

[tool.mypy]
python_version = "3.12"
files = ["src/neti"]
plugins = ["pydantic.mypy"]

# The core is the part that must be type-tight: it is the whole decision.
[[tool.mypy.overrides]]
module = "neti.core.*"
strict = true
disallow_any_explicit = false   # Resolution.evidence is deliberately dict[str, Any]

# The two deferred provider imports. Declared here rather than as inline `type: ignore` comments,
# because an inline ignore is only correct when the package is *absent*: install `neti[database]`
# and mypy starts reporting the ignore itself as unused, so `uv run mypy` passes or fails depending
# on which optional extras happen to be in the venv. That is the same failure `test_no_silent_skips`
# exists to prevent, one layer up — a gate whose result depends on the machine it ran on.
[[tool.mypy.overrides]]
module = ["psycopg.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings are errors. That is what turned a `psycopg` connection nobody closed into a test
# failure, and it stays.
#
# The two exemptions below are CrewAI's own import-time noise, narrowed to the exact message so
# nothing of ours can hide behind them. They were not caught for a
# while because the suite only imported `crewai` after some earlier test had already done so, and a
# warning fires once — so whether the suite passed depended on collection order. `tests/e2e/
# test_proof.py` imports it first and made that visible.
filterwarnings = [
    "error",
    # Matched on the message alone: CrewAI re-raises this through its own warning shim, so by the
    # time it surfaces the module attribution is pydantic's rather than crewai's.
    "default:BaseAgentConfig is deprecated:DeprecationWarning",
    "default:Cannot set an attribute on 'crewai.rag':ImportWarning",
]
