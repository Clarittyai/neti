[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neti"
version = "0.4.0"
description = "A preflight gate for agent tool calls: resolve what an action will touch, block it if it exceeds a declared ceiling."
# The generated copy, not README.md. PyPI renders the long description with no base URL, so every
# relative path in the original is dead there: five broken images and every doc link. Generated by
# tools/make_readme_pypi.py and checked by tests/property/test_media_is_current.py.
readme = "README.pypi.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "agents", "security", "blast-radius", "preflight", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.urls]
# Kept in step with src/neti/_website.py by tests/property/test_urls_agree.py — one place to edit.
Homepage = "https://neti-security.github.io/neti/"
Source = "https://github.com/Neti-Security/neti"
Issues = "https://github.com/Neti-Security/neti/issues"
Licensing = "https://github.com/Neti-Security/neti/blob/main/LICENSING.md"

[project.optional-dependencies]
graph = ["httpx[http2]>=0.27", "msal>=1.31"]
mcp = ["httpx[http2]>=0.27"]
cli = ["typer>=0.12", "rich>=13.9"]
console = ["fastapi>=0.115", "uvicorn>=0.32"]
# Only `storage.objects` needs this, and it imports boto3 inside the call rather than at module
# scope — so a policy that never binds that resolver never pays for it. Left out of `all`
# deliberately: boto3 is a large dependency to hand somebody who is gating a coding agent.
storage = ["boto3>=1.35"]
# `db.rows` needs no driver for sqlite (stdlib) and psycopg only for postgres. Same deferred-import
# shape as boto3, and out of `all` for the same reason.
database = ["psycopg[binary]>=3.2"]
# Everything a single machine needs, which is the entire free tier. `pipx install neti[all]`.
all = [
    "httpx[http2]>=0.27",
    "msal>=1.31",
    "typer>=0.12",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
# `neti suggest` calls the operator's own model with the operator's own key. Out of `all` and out
# of `sdks` deliberately: `pip install neti` must pull in no provider SDK, and somebody gating a
# coding agent should not acquire one by accident. Both are imported inside the function that
# uses them, so `import neti` never reaches either.
assist = ["anthropic>=0.69"]
assist-openai = ["openai>=2.0"]

# The agent runtimes neti adapts to. Test-only: nothing in `neti` imports them at module scope,
# and each adapter imports its SDK inside the function that needs it, so `pip install neti` pulls
# in none of them.
sdks = [
    "anthropic>=0.120",
    "openai>=2.0",
    "openai-agents>=0.19",
    "langchain-core>=0.3",
    # langgraph, not just langchain-core: the LangGraph adapter's only real regression test runs a
    # compiled StateGraph, because `ToolNode` requires a ToolMessage back and a direct `invoke`
    # never reveals that. Without this the one test that caught the defect silently skips.
    "langgraph>=0.6",
    # The umbrella package, for `langchain.agents.create_agent`. `tests/conformance/` builds the
    # agent a LangChain user actually builds, and in 1.x that constructor lives here — `langgraph`'s
    # `create_react_agent` is deprecated in its favour and warns loudly. Without this the row can
    # only drive the raw executor, which is a weaker claim than the one the matrix makes.
    "langchain>=1.0",
]
# The other four runtimes, kept out of `sdks` on purpose. These four resolve and install cleanly
# alongside everything above — measured, not assumed — but their closure is ~200 packages including
# chromadb, numpy, kubernetes and a full OpenTelemetry stack, almost all of it arriving via CrewAI.
# `just install` should not hand somebody gating a coding agent a vector database, so this is a
# separate line. CI installs both, and `tests/e2e/test_no_silent_skips.py` requires all four to
# import under NETI_REQUIRE_SDKS — otherwise four seams skip silently, which is the exact failure
# that file exists to prevent.
sdks-extended = [
    # 1.5.0 is where `crewai.hooks` first exists. Below that the only seam is wrapping
    # `CrewStructuredTool`, which is a pydantic model and a different adapter entirely.
    "crewai>=1.5.0",
    # 2.16 is where `ToolFailed` arrives — the exception that becomes a failed tool *result* rather
    # than a retry prompt, which is the shape this product needs.
    "pydantic-ai>=2.16",
    "autogen-agentchat>=0.5.5",
    "autogen-core>=0.5.5",
    # 1.7 is where plugin-level `before_tool_callback` arrives; `App(plugins=...)` needs 1.14.
    "google-adk>=1.14",
]
# Three more runtimes, kept out of both lines above and measured the same way: installing these
# three on top of everything else took the environment from 206 packages to 262. That is cheaper
# than `sdks-extended` and still not something to hand somebody who wanted to gate a coding agent,
# so it is its own line. CI installs it, and `tests/e2e/test_no_silent_skips.py` requires all three
# to import under NETI_REQUIRE_SDKS — otherwise three seams skip silently.
sdks-more = [
    "llama-index-core>=0.12",
    "smolagents>=1.0",
]
# **Semantic Kernel cannot share an environment with the OpenAI Agents SDK**, and pretending
# otherwise is how this project ended up publishing a claim nobody could reproduce.
#
#     openai-agents 0.19.2   requires pydantic>=2.12.2,<3
#     semantic-kernel 1.36   requires pydantic<2.12
#
# There is no version of pydantic that satisfies both. The environment the conformance table was
# recorded in had semantic-kernel 1.36.0 running against pydantic 2.13.4 — outside its own declared
# range — because packages were installed one at a time and each step skipped the constraint the
# last one set. The suite passed, and `neti score` printed "tested with semantic-kernel 1.36.0"
# against an environment no resolver would ever produce. That is exactly the unfalsifiable claim
# this repository exists not to make.
#
# The newer semantic-kernel that does allow pydantic 2.12 depends on `azure-ai-agents>=1.2.0b3`,
# which has no stable release, so taking it means enabling pre-releases for everything.
#
# So the two are declared as what they are: incompatible. `[tool.uv] conflicts` below tells the
# resolver to solve them separately, and CI installs this extra into its own environment. The
# conformance row for Semantic Kernel is produced there and is as real as every other row — it is
# simply not produced in the same virtualenv, which is a fact about the ecosystem rather than about
# this gate.
sdks-semantic-kernel = ["semantic-kernel==1.36.0"]
dev = [
    "pytest>=8.3",
    "types-pyyaml>=6.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.13",
    # Pinned to a minor range, and `ruff format --check` is why. The formatter's output changes
    # between minors, so an open floor means CI fails on a day nobody touched the code — and it
    # did: `src/neti/eval/proof.py` and `tests/integration/test_status.py` were committed formatted
    # under an older ruff and were unformatted under 0.16 without either file changing. A lint
    # floor can be open because a new rule is a finding; a *formatter* floor cannot, because a new
    # style is a red build with no defect behind it.
    "ruff>=0.16,<0.17",
]

[project.scripts]
# `main`, not `app`, so the one place that reconfigures stdout to UTF-8 is on the path every
# real invocation takes. Doing it at import instead would mutate the stream of anything that
# merely imports this module, the test runner included.
neti = "neti.cli:main"

[tool.hatch.build]
# The built console, produced at package time rather than committed — `just console-sync` runs the
# Next export and drops it in `src/neti/console`, which .gitignore excludes. Declared globally
# because `uv build` makes the wheel out of the sdist, so listing it on the wheel target alone
# leaves it out of both.
#
# A source checkout that has never built the web app simply has no console, and `neti console` says
# so rather than starting a server that answers every page with a 404.
artifacts = ["src/neti/console/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/neti"]

# The example policies travel with the package.
#
# `neti demo --here` is the first command the README gives a stranger, and it defaults to
# `examples/coding-agent.yaml`. That file was only ever found relative to a *source checkout*, so on
# a real install the headline command answered
#
#     error: cannot find examples/coding-agent.yaml. Pass -c with your own policy.
#
# which is the exact first impression `_packaged_example`'s own docstring says is worse than any
# finding is good. Found by installing the published package into a clean venv and running the
# documented flow, which is the only way this class of defect ever shows up.
#
# Kept at the repository root rather than moved under `src/`, because `cp examples/entra.yaml
# neti.yaml` is in the docs and in people's shells.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "neti/examples"

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "web/.next", "web/out", ".venv", "out", "dist"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Declared rather than inferred: ruff decides first-party by what is installed, so a checkout with
# the control plane installed sorted imports differently from one without, and `ruff format --check`
# disagreed with itself between a developer's machine and CI. `neti_cloud` stays listed for exactly
# that reason — it is a separate repository now, but a developer who has it installed alongside must
# still get the same sort as one who does not.
known-first-party = ["neti", "neti_cloud"]

[tool.mypy]
python_version = "3.12"
files = ["src/neti"]
plugins = ["pydantic.mypy"]

# The core is the part that must be type-tight: it is the whole decision.
[[tool.mypy.overrides]]
module = "neti.core.*"
strict = true
disallow_any_explicit = false   # Resolution.evidence is deliberately dict[str, Any]

# The two deferred provider imports. Declared here rather than as inline `type: ignore` comments,
# because an inline ignore is only correct when the package is *absent*: install `neti[database]`
# and mypy starts reporting the ignore itself as unused, so `uv run mypy` passes or fails depending
# on which optional extras happen to be in the venv. That is the same failure `test_no_silent_skips`
# exists to prevent, one layer up — a gate whose result depends on the machine it ran on.
#
# `semantic_kernel` joined them when it moved to its own extra: it conflicts with `openai-agents`
# over pydantic, so the environment `gates` runs mypy in cannot contain it. Same reasoning, and the
# same fix — the adapter imports it inside the function that needs it, so its absence is the
# ordinary case rather than a broken install.
[[tool.mypy.overrides]]
module = ["psycopg.*", "boto3.*", "botocore.*", "smolagents.*", "semantic_kernel.*"]
ignore_missing_imports = true

# The cost of the line above, paid in one place rather than with an inline ignore. Once
# `semantic_kernel` is untyped, its `@kernel_function` decorator is untyped, so the function it
# decorates becomes untyped too. An inline `type: ignore` here would be correct only while the
# package is absent and would report itself as unused the moment somebody installs the extra —
# which is the machine-dependent gate the comment above exists to avoid.
[[tool.mypy.overrides]]
module = "neti.eval.proof"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings are errors. That is what turned a `psycopg` connection nobody closed into a test
# failure, and it stays.
#
# The two exemptions below are CrewAI's own import-time noise, narrowed to the exact message so
# nothing of ours can hide behind them. They were not caught for a
# while because the suite only imported `crewai` after some earlier test had already done so, and a
# warning fires once — so whether the suite passed depended on collection order. `tests/e2e/
# test_proof.py` imports it first and made that visible.
filterwarnings = [
    "error",
    # Matched on the message alone: CrewAI re-raises this through its own warning shim, so by the
    # time it surfaces the module attribution is pydantic's rather than crewai's.
    "default:BaseAgentConfig is deprecated:DeprecationWarning",
    "default:Cannot set an attribute on 'crewai.rag':ImportWarning",
    # Google ADK announces its own experimental features through the warnings system. It is the
    # library telling its users something true about itself, on a code path this project does not
    # control and cannot opt out of; turning it into a test failure would only mean the ADK
    # conformance row stops running the first time Google marks another feature experimental.
    "default:\\[EXPERIMENTAL\\]:UserWarning",
]

[tool.uv]
# Declared rather than discovered. Without this the resolver has to find one environment that
# satisfies both, and there isn't one — so it either fails outright or quietly picks a
# semantic-kernel old enough to satisfy everybody (1.8.0), which the adapter cannot use and which
# fails eleven seam tests. Naming the conflict is what lets `uv lock` produce both environments.
#
# Needs uv >= 0.5.29, where `conflicts` was added. An older uv prints "unknown field `conflicts`"
# and carries on ignoring it, which resolves the wrong environment rather than refusing — so if the
# semantic-kernel tests start failing on a machine where they used to pass, check `uv --version`
# first. CI pins nothing here because `astral-sh/setup-uv` installs a current release.
conflicts = [
    [{ extra = "sdks" }, { extra = "sdks-semantic-kernel" }],
    [{ extra = "sdks-extended" }, { extra = "sdks-semantic-kernel" }],
    [{ extra = "sdks-more" }, { extra = "sdks-semantic-kernel" }],
]
