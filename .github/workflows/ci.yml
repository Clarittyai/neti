name: ci

on:
  push:
  pull_request:

jobs:
  # The determinism matrix is the point of this job, not a nicety. `run(x) == run(x)` in one
  # process is trivially true; what actually catches set/dict iteration order leaking into a
  # record digest is running on different hash seeds and different architectures. macOS is here
  # for the arm64/x86_64 split.
  # windows-latest is here because two things in this package are platform-specific and were both
  # written on macOS: the cross-process file lock (fcntl vs msvcrt) and where `neti init` looks for
  # Claude Desktop's config. A top-level `import fcntl` would have made `import neti` raise on every
  # Windows machine, and nothing in the suite would have noticed.
  # `sdks`, `storage` and `database` are in the install line for one reason: without them the
  # Anthropic, OpenAI Agents, LangChain and LangGraph adapter tests hit `importorskip` and
  # disappear from the summary. Eighteen tests covering the three runtimes most people reach for
  # were silently not running, and the LangGraph defect that crashed a whole graph on a blocked
  # call shipped through a green CI because of it. NETI_REQUIRE_SDKS turns a skip back into a
  # failure — see tests/e2e/test_no_silent_skips.py.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        hashseed: ["0", "1", "random"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
      NETI_REQUIRE_SDKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # Node is here so `neti gate --stdio` is exercised against a real MCP server over a real
      # pipe, rather than only against an in-process fake. It is the transport every local server
      # in Claude Code, Claude Desktop and Cursor actually uses.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The console is a shipped artifact — `[tool.hatch.build] artifacts` puts it in the wheel —
      # and it is gitignored because it is built rather than committed. Without this step a plain
      # checkout has none, and the four tests asserting every console route is served skipped on
      # every CI run: the surface a customer actually looks at, untested, invisibly.
      - name: build the console
        run: cd web && npm ci --silent && npm run build
      - run: cp -R web/out src/neti/console
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev,cli,graph,mcp,console,sdks,sdks-extended,storage,database]'
      - run: uv run pytest -q

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev,cli,graph,mcp,console,sdks,sdks-extended,storage,database]'
      - name: types
        run: uv run mypy
      - name: lint
        run: uv run ruff check
      - name: format
        run: uv run ruff format --check

  # Separated so a latency regression is legible as one, rather than as "the test suite is red".
  # These budgets measure neti's own overhead with the network mocked; the real budget belongs to
  # Microsoft Graph and only `neti measure` against a live tenant can settle it.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev,cli,graph,mcp,console]'
      # Warm-up run, discarded. These budgets are microseconds of pure CPU, and the first execution
      # after an install pays for cold imports and bytecode compilation *inside* the timed section —
      # which showed up as a 10x miss and looked exactly like a real regression.
      - run: uv run pytest -q tests/bench || true
      - run: uv run pytest -q tests/bench

  # This wheel says Apache-2.0 in its metadata, and metadata is what tooling and auditors read. BUSL
  # code inside it would be a licence misstatement that no README corrects.
  #
  # This used to build both distributions and check them against each other. The control plane is a
  # separate repository now, so this checks the half that lives here; the other half — that the BUSL
  # wheel contains no Apache-2.0 package — runs in `neti-cloud`'s own CI, where that wheel is built.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - name: the Apache-2.0 wheel contains nothing but the gate
        run: |
          python - <<'CHECK'
          import glob
          import sys
          import zipfile

          free = zipfile.ZipFile(glob.glob("dist/neti-*.whl")[0]).namelist()
          if any(n.startswith("neti_cloud/") for n in free):
              sys.exit("licence boundary violated: the Apache-2.0 wheel contains BUSL code")
          print("free:", len(free), "files")
          CHECK
