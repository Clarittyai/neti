name: ci

on:
  push:
  pull_request:

jobs:
  # The determinism matrix is the point of this job, not a nicety. `run(x) == run(x)` in one
  # process is trivially true; what actually catches set/dict iteration order leaking into a
  # record digest is running on different hash seeds and different architectures. macOS is here
  # for the arm64/x86_64 split.
  # windows-latest is here because two things in this package are platform-specific and were both
  # written on macOS: the cross-process file lock (fcntl vs msvcrt) and where `neti init` looks for
  # Claude Desktop's config. A top-level `import fcntl` would have made `import neti` raise on every
  # Windows machine, and nothing in the suite would have noticed.
  # `sdks`, `storage` and `database` are in the install line for one reason: without them the
  # Anthropic, OpenAI Agents, LangChain and LangGraph adapter tests hit `importorskip` and
  # disappear from the summary. Eighteen tests covering the three runtimes most people reach for
  # were silently not running, and the LangGraph defect that crashed a whole graph on a blocked
  # call shipped through a green CI because of it. NETI_REQUIRE_SDKS turns a skip back into a
  # failure — see tests/e2e/test_no_silent_skips.py.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        hashseed: ["0", "1", "random"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
      NETI_REQUIRE_SDKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # Node is here so `neti gate --stdio` is exercised against a real MCP server over a real
      # pipe, rather than only against an in-process fake. It is the transport every local server
      # in Claude Code, Claude Desktop and Cursor actually uses.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The console is a shipped artifact — `[tool.hatch.build] artifacts` puts it in the wheel —
      # and it is gitignored because it is built rather than committed. Without this step a plain
      # checkout has none, and the four tests asserting every console route is served skipped on
      # every CI run: the surface a customer actually looks at, untested, invisibly.
      - name: build the console
        run: cd web && npm ci --silent && npm run build
      - run: cp -R web/out src/neti/console
      # `uv sync --frozen`, not `uv pip install`. The lockfile is committed and was being ignored:
      # every run resolved fresh, so the SDK versions drifted from the ones `neti score` publishes
      # and the conformance table went red on any upstream release, with no defect behind it. This
      # installs exactly what the lock says, which is what makes "tested with LangChain 1.3.14" a
      # sentence somebody can reproduce.
      - run: uv sync --frozen --extra dev --extra cli --extra graph --extra mcp --extra console --extra sdks --extra sdks-extended --extra sdks-more --extra storage --extra database
      - run: uv run pytest -q

  # Semantic Kernel cannot share an environment with the OpenAI Agents SDK — `semantic-kernel` 1.36
  # requires `pydantic<2.12` and `openai-agents` requires `>=2.12.2`, and no version satisfies both.
  # `pyproject.toml` declares the conflict; this is where the other half of it runs.
  #
  # Without this job the split would be the exact failure `test_no_silent_skips.py` exists to
  # prevent: a runtime quietly tested nowhere, with a green build over the top. That file asserts
  # both sides — absent in the main environment above, present here — so a runtime cannot fall out
  # of both and go unnoticed.
  split-runtime:
    runs-on: ubuntu-latest
    env:
      NETI_REQUIRE_SDKS: "1"
      NETI_SPLIT_ENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev --extra cli --extra graph --extra mcp --extra console --extra sdks-semantic-kernel
      - name: the Semantic Kernel seams, and the assertion that they ran
        run: uv run pytest -q -k "semantic_kernel or semantic-kernel" tests/e2e/test_no_silent_skips.py tests/e2e/test_seam_equivalence.py tests/conformance

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # `uv sync --frozen`, not `uv pip install`. The lockfile is committed and was being ignored:
      # every run resolved fresh, so the SDK versions drifted from the ones `neti score` publishes
      # and the conformance table went red on any upstream release, with no defect behind it. This
      # installs exactly what the lock says, which is what makes "tested with LangChain 1.3.14" a
      # sentence somebody can reproduce.
      - run: uv sync --frozen --extra dev --extra cli --extra graph --extra mcp --extra console --extra sdks --extra sdks-extended --extra sdks-more --extra storage --extra database
      - name: types
        run: uv run mypy
      - name: lint
        run: uv run ruff check
      - name: format
        run: uv run ruff format --check

  # Separated so a latency regression is legible as one, rather than as "the test suite is red".
  # These budgets measure neti's own overhead with the network mocked; the real budget belongs to
  # Microsoft Graph and only `neti measure` against a live tenant can settle it.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev,cli,graph,mcp,console]'
      # Warm-up run, discarded. These budgets are microseconds of pure CPU, and the first execution
      # after an install pays for cold imports and bytecode compilation *inside* the timed section —
      # which showed up as a 10x miss and looked exactly like a real regression.
      - run: uv run pytest -q tests/bench || true
      - run: uv run pytest -q tests/bench

  # The site is a Next.js app now, and nothing in this file built it. That is not hypothetical: the
  # migration merged, every Vercel deploy failed for the next hour, and the only signal was an email
  # to one person's inbox. Two stale *project settings* — `framework: fastapi` and
  # `outputDirectory: docs`, left over from when this was a static import and not overridable from
  # `vercel.json` — sent the build hunting for `docs/routes-manifest.json`.
  #
  # A CI job cannot catch a wrong dashboard setting. It can catch everything else that breaks this
  # build, and it turns "the site is down and nobody has noticed" into a red check on the PR. The
  # byte-for-byte assertion is the one that matters most: the pages are served verbatim so their
  # inline scripts run and the CSP hashes stay valid, and a well-meaning move to a React page would
  # silently kill every live demo on the site.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
      - name: the pages are still served byte for byte
        run: |
          npx next start -p 4123 &
          for i in $(seq 1 40); do curl -sfo /dev/null http://127.0.0.1:4123/cloud && break; sleep 1; done
          for pair in "/:docs/index.html" "/cloud:docs/cloud/index.html"; do
            url="${pair%%:*}"; file="${pair##*:}"
            curl -sS "http://127.0.0.1:4123$url" -o /tmp/served.html
            if ! cmp -s /tmp/served.html "$file"; then
              echo "::error::$url no longer matches $file byte for byte."
              echo "The pages carry inline <script> — the demos and the contact modal. Serving"
              echo "anything but the built file kills them silently and invalidates the CSP hashes."
              exit 1
            fi
            echo "  $url == $file ($(wc -c <"$file") bytes)"
          done

  # This wheel says Apache-2.0 in its metadata, and metadata is what tooling and auditors read. BUSL
  # code inside it would be a licence misstatement that no README corrects.
  #
  # This used to build both distributions and check them against each other. The control plane is a
  # separate repository now, so this checks the half that lives here; the other half — that the BUSL
  # wheel contains no Apache-2.0 package — runs in `neti-cloud`'s own CI, where that wheel is built.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - name: the Apache-2.0 wheel contains nothing but the gate
        run: |
          python - <<'CHECK'
          import glob
          import sys
          import zipfile

          free = zipfile.ZipFile(glob.glob("dist/neti-*.whl")[0]).namelist()
          if any(n.startswith("neti_cloud/") for n in free):
              sys.exit("licence boundary violated: the Apache-2.0 wheel contains BUSL code")
          print("free:", len(free), "files")
          CHECK

  # The class of defect no suite above can see: works in a checkout, broken once installed. Six
  # have shipped that way — `neti demo --here` failing on the README's opening command, `neti init`
  # pointing at a directory that does not exist on an install, seven commands answering a raw
  # errno, and `neti prove` refusing the policy `neti start` writes. Every one was found by
  # building the wheel, installing it into an empty virtualenv and running the documented journey.
  #
  # `tools/verify_install.py` did that and was marked "never in CI", so it only ran when somebody
  # remembered — and its `neti prove` check sat failing, unseen, through a release. A check nobody
  # runs is a check that decays into a claim, which is the shape of defect this repository keeps
  # finding in itself. It runs here now.
  #
  # `--local` installs this tree rather than PyPI, so it tests the commit that triggered it. The
  # PyPI form stays a manual `just e2e`, for after a release.
  installed:
    # Both Unix platforms, because the difference between them is where this class of bug lives:
    # the scratch-directory exemption asked `tempfile.gettempdir()`, which is `/var/folders/…` on
    # macOS and `/tmp` on Linux, so `cd /tmp && ls` asked for confirmation on one of them and not
    # the other. A single-platform job would have shipped that twice.
    #
    # Windows is not here yet, and the reason is the product rather than the runner: the day-zero
    # checks name `~/.ssh/id_rsa` and `neti prove` picks `/etc/hosts`, neither of which exists
    # there. The suite covers Windows; this journey does not, and saying so beats a job that
    # silently skips the half that matters.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The console ships in the wheel, and one of the checks below serves every route from it.
      - name: build the console
        run: cd web && npm ci --silent && npm run build
      - run: cp -R web/out src/neti/console
      - run: uv run python tools/verify_install.py --local
