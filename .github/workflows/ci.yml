name: ci

on:
  push:
  pull_request:

jobs:
  # The determinism matrix is the point of this job, not a nicety. `run(x) == run(x)` in one
  # process is trivially true; what actually catches set/dict iteration order leaking into a
  # record digest is running on different hash seeds and different architectures. macOS is here
  # for the arm64/x86_64 split.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        hashseed: ["0", "1", "random"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev,cli,graph,mcp,console]' -e ./cloud
      - run: uv run pytest -q

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev,cli,graph,mcp,console]' -e ./cloud
      - name: types
        run: uv run mypy
      - name: lint
        run: uv run ruff check
      - name: format
        run: uv run ruff format --check

  # Separated so a latency regression is legible as one, rather than as "the test suite is red".
  # These budgets measure neti's own overhead with the network mocked; the real budget belongs to
  # Microsoft Graph and only `neti measure` against a live tenant can settle it.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev,cli,graph,mcp,console]' -e ./cloud
      # Warm-up run, discarded. These budgets are microseconds of pure CPU, and the first execution
      # after an install pays for cold imports and bytecode compilation *inside* the timed section —
      # which showed up as a 10x miss and looked exactly like a real regression.
      - run: uv run pytest -q tests/bench || true
      - run: uv run pytest -q tests/bench

  # Two distributions, two licences, and the metadata has to say so. BUSL code inside a wheel whose
  # metadata claims Apache-2.0 is a licence misstatement that no README corrects, because metadata is
  # what tooling and auditors read.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: build both
        run: |
          uv build
          uv build --project cloud
      - name: the wheels do not contain each other
        run: |
          python - <<'CHECK'
          import zipfile, glob, sys
          free = zipfile.ZipFile(glob.glob("dist/neti-*.whl")[0]).namelist()
          paid = zipfile.ZipFile(glob.glob("cloud/dist/neti_cloud-*.whl")[0]).namelist()
          bad = []
          if any(n.startswith("neti_cloud/") for n in free):
              bad.append("the Apache-2.0 wheel contains BUSL code")
          if any(n.startswith("neti/") for n in paid):
              bad.append("the BUSL wheel contains the Apache-2.0 package")
          if bad:
              sys.exit("licence boundary violated: " + "; ".join(bad))
          print("free:", len(free), "files | paid:", len(paid), "files")
          CHECK
